name: iOS unsigned IPA

# Manual runs only: each build eats ~1h of macOS minutes plus LFS bandwidth.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA for Sideloadly
    runs-on: macos-15
    steps:
      - name: Free disk space (drop superseded Xcodes)
        run: |
          set -euo pipefail
          df -h / | tail -1
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          # BSD sort has no -V: compare version numbers numerically.
          VERSIONS=$(ls -d /Applications/Xcode*.app 2>/dev/null | sed -E 's/.*Xcode_([0-9.]+)\.app/\1/' | grep -E '^[0-9.]+$' | sort -t. -k1,1n -k2,2n -k3,3n || true)
          COUNT=$(echo "$VERSIONS" | grep -c . || true)
          if [ "$COUNT" -gt 1 ]; then
            KEEP=$(echo "$VERSIONS" | tail -1)
            echo "$VERSIONS" | grep -v -F -x "$KEEP" | while read -r OLD; do
              echo "Removing /Applications/Xcode_${OLD}.app"
              sudo rm -rf "/Applications/Xcode_${OLD}.app"
            done
          fi
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sed -E 's/.*Xcode_([0-9.]+)\.app/\1/' | grep -E '^[0-9.]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "/Applications/Xcode_${LATEST}.app/Contents/Developer"
          fi
          xcodebuild -version

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-6000.5.6f1
          restore-keys: |
            Library-iOS-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: auto
          buildMethod: PaperTrails.Editor.ProjectBuilder.iOS
          versioning: None
          cacheUnityInstallationOnMac: true

      - name: Archive unsigned and package IPA
        run: |
          set -euo pipefail
          cd Builds/iOS
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath "$PWD/build.xcarchive" \
            archive CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -R build.xcarchive/Products/Applications/*.app Payload/
          /usr/bin/zip -r "$PWD/../PaperTrails-unsigned.ipa" Payload
          ls -la ../PaperTrails-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PaperTrails-unsigned-ipa
          path: Builds/PaperTrails-unsigned.ipa
