name: iOS unsigned IPA

# Manual runs only: each build eats ~1h of macOS minutes plus LFS bandwidth.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA for Sideloadly
    runs-on: macos-15
    steps:
      - name: Free disk space (drop superseded Xcodes)
        run: |
          set -euo pipefail
          df -h / | tail -1
          ver_of() { /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$1/Contents/Info.plist" 2>/dev/null || echo "0"; }
          # Pick the newest Xcode that is actually usable; version number alone
          # is not trustworthy (stubs sort high but have no developer dir).
          KEEP=""; KEEPVER="0"
          for APP in /Applications/Xcode*.app; do
            [ -e "$APP" ] || continue
            if [ -x "$APP/Contents/Developer/usr/bin/xcodebuild" ]; then
              V=$(ver_of "$APP")
              HIGHEST=$(printf "%s\n%s\n" "$V" "$KEEPVER" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
              if [ "$HIGHEST" = "$V" ]; then KEEP="$APP"; KEEPVER="$V"; fi
            else
              echo "Skipping invalid: $APP"
            fi
          done
          if [ -z "$KEEP" ]; then echo "ERROR: no valid Xcode found"; ls /Applications | grep -i xcode || true; exit 1; fi
          echo "Keeper: $KEEP ($KEEPVER)"
          for APP in /Applications/Xcode_*.app; do
            if [ "$APP" != "$KEEP" ]; then echo "Removing $APP"; sudo rm -rf "$APP"; fi
          done
          sudo xcode-select -s "$KEEP/Contents/Developer"
          xcodebuild -version
          df -h / | tail -1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-6000.5.6f1
          restore-keys: |
            Library-iOS-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: auto
          buildMethod: PaperTrails.Editor.ProjectBuilder.iOS
          versioning: None
          cacheUnityInstallationOnMac: true

      - name: Archive unsigned and package IPA
        run: |
          set -euo pipefail
          cd Builds/iOS
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath "$PWD/build.xcarchive" \
            archive CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -R build.xcarchive/Products/Applications/*.app Payload/
          /usr/bin/zip -r "$PWD/../PaperTrails-unsigned.ipa" Payload
          ls -la ../PaperTrails-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PaperTrails-unsigned-ipa
          path: Builds/PaperTrails-unsigned.ipa
