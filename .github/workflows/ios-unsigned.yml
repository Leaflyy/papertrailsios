name: iOS unsigned IPA

# Manual runs only: each build eats ~1h of macOS minutes plus LFS bandwidth.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA for Sideloadly
    runs-on: macos-15
    steps:
      - name: Free disk space (drop superseded Xcodes)
        run: |
          df -h / | tail -1
          APPS=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V)
          echo "$APPS"
          COUNT=$(echo "$APPS" | grep -c . || true)
          if [ "$COUNT" -gt 1 ]; then
            KEEP=$(echo "$APPS" | tail -1)
            echo "$APPS" | grep -v -F "$KEEP" | while read -r OLD; do
              echo "Removing $OLD"
              sudo rm -rf "$OLD"
            done
          fi
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-6000.5.6f1
          restore-keys: |
            Library-iOS-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: auto
          buildMethod: PaperTrails.Editor.ProjectBuilder.iOS
          versioning: None
          cacheUnityInstallationOnMac: true

      - name: Archive unsigned and package IPA
        run: |
          cd Builds/iOS
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath "$PWD/build.xcarchive" \
            archive CODE_SIGNING_ALLOWED=NO | tail -5
          mkdir -p Payload
          cp -R build.xcarchive/Products/Applications/*.app Payload/
          /usr/bin/zip -r "$PWD/../PaperTrails-unsigned.ipa" Payload
          ls -la ../PaperTrails-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PaperTrails-unsigned-ipa
          path: Builds/PaperTrails-unsigned.ipa
